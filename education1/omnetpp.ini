###############################################################################
# 案例二：卫星网络视频流传输（教学实验配置）
#
# 拓扑：视频发送端 videoServer --(卫星星座)--> 视频接收端 videoClient
# 业务：UDP 视频流，服务端按固定包长发包，客户端统计端到端时延与吞吐
#
# 运行（命令行，推荐）：
#   cd ~/omnetpp-6.3.0 && source setenv
#   cd workspace/satnet3d/simulations/education && sh ./run -u Cmdenv
#
# 运行（图形界面，看三维星座）：
#   sh ./run -u Qtenv
###############################################################################

[General]
network = satnet3d.simulations.education1.SatNet3DEducationNetwork

# 仿真时长：留足时间让星座建链、DHCP 完成、视频流稳定传输
sim-time-limit = 180s

# 命令行模式：打开快速模式，减少日志量；结果仍完整写入 results/
cmdenv-express-mode = true

# 本教学实验不需要 OSG 三维可视化（节省内存，方便在服务器/无显卡环境运行）
# 需要看三维星座时把下面几行注释掉即可
*.visualizer.osgVisualizer.typename = ""

# 场景坐标原点：接近地心（卫星绝对坐标计算依赖该配置）
*.coordinateSystem.sceneLatitude = 0deg
*.coordinateSystem.sceneLongitude = 0deg
*.coordinateSystem.sceneAltitude = -6378137m
*.coordinateSystem.sceneHeading = 90deg
*.coordinateSystem.sceneElevation = 0deg
*.coordinateSystem.sceneBank = 0deg

# ---------------------------------------------------------------------------
# 1. 星座参数：Walker-Delta 48 星（8 轨道面 × 6 星/面）
#    高度 1414 km、倾角 52°——与教学竞赛案例保持一致的典型 LEO 配置
# ---------------------------------------------------------------------------
*.walkerDeltaScenarioManager.autoGenerateConstellation = true
*.walkerDeltaScenarioManager.numPlanes = 8
*.walkerDeltaScenarioManager.satsPerPlane = 6
*.walkerDeltaScenarioManager.phaseFactor = 0
*.walkerDeltaScenarioManager.orbitalAltitude = 1414km
*.walkerDeltaScenarioManager.orbitalInclination = 52deg
*.walkerDeltaScenarioManager.connectionType = "oneStarFourLinks"
*.walkerDeltaScenarioManager.interSatelliteChannelType = "satnet3d.wireless.DynamicChannel"
*.walkerDeltaScenarioManager.datarate = 1Gbps

# 全局链路速率（星间/星地）
**.bitrate = 1Gbps

# ---------------------------------------------------------------------------
# 2. 地面站位置（案例二的"两台电脑"在仿真中的对应物）
#    videoServer：北京    videoClient：伦敦
# ---------------------------------------------------------------------------
*.videoServer.mobility.latitude = 39.9deg
*.videoServer.mobility.longitude = 116.4deg
*.videoServer.mobility.altitude = 50m

*.videoClient.mobility.latitude = 51.5deg
*.videoClient.mobility.longitude = -0.1deg
*.videoClient.mobility.altitude = 30m

# ---------------------------------------------------------------------------
# 3. 地址分配
#    星间链路：静态地址 10.0.x.x
#    星地链路：卫星充当 DHCP 服务器（eth4），地面站为 DHCP 客户端
# ---------------------------------------------------------------------------
*.satellite[*].bridging.interfaceRelay.selector.typename = "SatNet3DRelayInterfaceSelector"

*.configurator.config = xml("<config>\
                                <interface hosts='satellite[*]' address='10.0.x.x' netmask='255.255.x.x'/>\
                            </config>")

*.satellite[*].hasDhcp = true
*.satellite[*].dhcp.interfaceTableModule = "^.interfaceTable"
*.satellite[*].dhcp.interface = "eth4"
*.satellite[*].dhcp.numReservedAddresses = 2
*.satellite[*].dhcp.maxNumClients = 1
*.satellite[*].dhcp.leaseTime = 30s
*.satellite[*].dhcp.startTime = 1s

*.videoServer.numApps = 2
*.videoServer.app[0].typename = "DhcpClient"
*.videoServer.app[0].interfaceTableModule = "^.interfaceTable"
*.videoServer.app[0].routingTableModule = "^.ipv4.routingTable"
*.videoServer.app[0].interface = "eth0"
*.videoServer.app[0].startTime = 2s

*.videoClient.numApps = 2
*.videoClient.app[0].typename = "DhcpClient"
*.videoClient.app[0].interfaceTableModule = "^.interfaceTable"
*.videoClient.app[0].routingTableModule = "^.ipv4.routingTable"
*.videoClient.app[0].interface = "eth0"
*.videoClient.app[0].startTime = 2s

# ---------------------------------------------------------------------------
# 4. 视频流业务
#    app[0] = DHCP 客户端，app[1] = 视频应用
#
#    码率估算：packetLen / sendInterval
#      1400B / 5ms ≈ 2.24 Mbps（接近教学演示用 720p/1080p 低码率视频）
#    sendInterval 用区间分布，模拟视频帧间的不均匀发送，制造时延抖动
# ---------------------------------------------------------------------------
*.videoServer.app[1].typename = "UdpVideoStreamServer"
*.videoServer.app[1].localPort = 5000
*.videoServer.app[1].packetLen = 1400B
*.videoServer.app[1].sendInterval = uniform(4ms, 7ms)
*.videoServer.app[1].videoSize = 30MB

*.videoClient.app[1].typename = "UdpVideoStreamClient"
*.videoClient.app[1].localPort = -1
*.videoClient.app[1].serverAddress = "videoServer"
*.videoClient.app[1].serverPort = 5000
# 等 DHCP 完成、路由收敛后再请求视频
*.videoClient.app[1].startTime = 20s

# ---------------------------------------------------------------------------
# 5. 结果记录
# ---------------------------------------------------------------------------
# 端到端时延：histogram（统计 mean/max/p99）+ vector（逐包时延曲线）
*.videoClient.app[1].endToEndDelay:histogram = true
*.videoClient.app[1].endToEndDelay:vector = true
*.videoClient.app[1].throughput:vector = true

# 服务端发包统计
*.videoServer.app[1].packetSent:vector = false
