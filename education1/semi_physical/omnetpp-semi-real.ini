###############################################################################
# 案例二 · 半实物「三机两段」真机版配置
#
#   电脑A 192.168.100.2 ──网线── B:网卡1 192.168.100.1
#                                  │
#                          48 星仿真域（本进程）
#                                  │
#   电脑C 192.168.101.2 ──网线── B:网卡2 192.168.101.1
#
# 与 omnetpp-semi.ini（单机 veth 版）的唯一实质区别：
#   gatewayB 的 realLocalAddress 由 127.0.0.1 改为 192.168.101.1。
#   单机版 C 端地址就在本机，绑回环也送得到；三机版若仍绑 127.0.0.1，
#   内核会拒绝把源地址 127.0.0.1 的包发上物理网卡，C 端收不到任何帧。
#
# 运行前（B 上）：
#   1) 两块网卡已配好 192.168.100.1/24 与 192.168.101.1/24，且都不要配默认网关
#   2) B 的内核转发必须关闭：sysctl net.ipv4.ip_forward 应为 0
#      （否则 A 可直接经 B 到达 C，旁路仿真，实验失效）
#   3) 5000、5001 两个 UDP 端口空闲
#
# 启动：
#   cd ~/omnetpp-6.3.0/workspace/satnet3d/simulations/education
#   sh ./run -u Cmdenv -f semi_physical/omnetpp-semi-real.ini
###############################################################################

[General]
network = satnet3d.simulations.education1.SatNet3DEducationSemiPhysicalNetwork

# 演示留足时长：15 分钟，足够摆机位、录 30 s、回答提问
sim-time-limit = 900s
cmdenv-express-mode = true
cmdenv-status-frequency = 10s

# 半实物的关键：仿真必须跟着真实时钟走
scheduler-class = inet::RealTimeScheduler

*.visualizer.osgVisualizer.typename = ""

*.coordinateSystem.sceneLatitude = 0deg
*.coordinateSystem.sceneLongitude = 0deg
*.coordinateSystem.sceneAltitude = -6378137m
*.coordinateSystem.sceneHeading = 90deg
*.coordinateSystem.sceneElevation = 0deg
*.coordinateSystem.sceneBank = 0deg

# ---------------------------------------------------------------------------
# 星座：8 面 × 6 星 = 48，1414 km，52°
# ---------------------------------------------------------------------------
*.walkerDeltaScenarioManager.autoGenerateConstellation = true
*.walkerDeltaScenarioManager.numPlanes = 8
*.walkerDeltaScenarioManager.satsPerPlane = 6
*.walkerDeltaScenarioManager.phaseFactor = 0
*.walkerDeltaScenarioManager.orbitalAltitude = 1414km
*.walkerDeltaScenarioManager.orbitalInclination = 52deg
*.walkerDeltaScenarioManager.connectionType = "oneStarFourLinks"
*.walkerDeltaScenarioManager.interSatelliteChannelType = "satnet3d.wireless.DynamicChannel"
*.walkerDeltaScenarioManager.datarate = 1Gbps

**.bitrate = 1Gbps

# ---------------------------------------------------------------------------
# 两台接入点位置（决定各自接哪颗卫星）
# ---------------------------------------------------------------------------
*.gatewayA.mobility.latitude = 39.9deg
*.gatewayA.mobility.longitude = 116.4deg
*.gatewayA.mobility.altitude = 50m

*.gatewayB.mobility.latitude = 51.5deg
*.gatewayB.mobility.longitude = -0.1deg
*.gatewayB.mobility.altitude = 30m

# ---------------------------------------------------------------------------
# 地址分配（卫星 eth4 作 DHCP 服务器，均为仿真域内地址，与真实网卡无关）
# ---------------------------------------------------------------------------
*.satellite[*].bridging.interfaceRelay.selector.typename = "SatNet3DRelayInterfaceSelector"

*.configurator.config = xml("<config>\
                                <interface hosts='satellite[*]' address='10.0.x.x' netmask='255.255.x.x'/>\
                            </config>")

*.satellite[*].hasDhcp = true
*.satellite[*].dhcp.interfaceTableModule = "^.interfaceTable"
*.satellite[*].dhcp.interface = "eth4"
*.satellite[*].dhcp.numReservedAddresses = 2
*.satellite[*].dhcp.maxNumClients = 1
*.satellite[*].dhcp.leaseTime = 30s
*.satellite[*].dhcp.startTime = 1s

# ---------------------------------------------------------------------------
# gatewayA：真实视频入口（收 A 的 192.168.100.2 → 192.168.100.1:5000，
#           转成仿真包发给 gatewayB:5001）
# ---------------------------------------------------------------------------
*.gatewayA.numApps = 2
*.gatewayA.app[0].typename = "DhcpClient"
*.gatewayA.app[0].interfaceTableModule = "^.interfaceTable"
*.gatewayA.app[0].routingTableModule = "^.ipv4.routingTable"
*.gatewayA.app[0].interface = "eth0"
*.gatewayA.app[0].startTime = 2s

*.gatewayA.app[1].typename = "ExternalUdpBridge"
*.gatewayA.app[1].realLocalAddress = "192.168.100.1"
*.gatewayA.app[1].realLocalPort = 5000
*.gatewayA.app[1].simDestAddress = "gatewayB"
*.gatewayA.app[1].simDestPort = 5001
*.gatewayA.app[1].realDestAddress = ""
*.gatewayA.app[1].realDestPort = 0
*.gatewayA.app[1].pollInterval = 1ms

# ---------------------------------------------------------------------------
# gatewayB：仿真出口（仿真侧监听 5001，出网发给真实接收端 C:192.168.101.2:5000）
#           ★ 真机版：绑网卡2 的地址，不能用 127.0.0.1
# ---------------------------------------------------------------------------
*.gatewayB.numApps = 2
*.gatewayB.app[0].typename = "DhcpClient"
*.gatewayB.app[0].interfaceTableModule = "^.interfaceTable"
*.gatewayB.app[0].routingTableModule = "^.ipv4.routingTable"
*.gatewayB.app[0].interface = "eth0"
*.gatewayB.app[0].startTime = 2s

*.gatewayB.app[1].typename = "ExternalUdpBridge"
*.gatewayB.app[1].realLocalAddress = "192.168.101.1"
*.gatewayB.app[1].realLocalPort = 5001
*.gatewayB.app[1].simLocalPort = 5001
*.gatewayB.app[1].simDestAddress = ""
*.gatewayB.app[1].simDestPort = 5001
*.gatewayB.app[1].realDestAddress = "192.168.101.2"
*.gatewayB.app[1].realDestPort = 5000
*.gatewayB.app[1].pollInterval = 1ms

# ---------------------------------------------------------------------------
# 结果记录：只关心桥接模块的收发计数
# ---------------------------------------------------------------------------
**.vector-recording = true
